name: Weekly company discovery

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC = 07:30 IST, before the daily feed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the encryption library
        run: pip install --quiet "cryptography>=42"
      - name: Unlock data
        env:
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: python scripts/vault.py open
      - name: Find new sponsor companies with matching roles
        run: python scripts/discover.py
      - name: Lock data again
        env:
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: python scripts/vault.py seal
      - name: Save results
        run: |
          git config user.name "job-hunt-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly discovery $(date -u +%F)"
          git push
