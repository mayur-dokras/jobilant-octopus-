name: Daily job feed

on:
  schedule:
    - cron: "30 2 * * *"  # 02:30 UTC = 08:00 IST every day (India has no daylight saving)
  workflow_dispatch:       # "Run workflow" button for a manual refresh
    inputs:
      test_email:
        description: "Also send a test email with your 3 best open roles"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the encryption library
        run: pip install --quiet "cryptography>=42"
      - name: Unlock data
        env:
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: python scripts/vault.py open
      - name: Fetch and score roles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: python scripts/fetch_jobs.py
      - name: Email the strongest new matches
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_MIN_MATCH: ${{ vars.ALERT_MIN_MATCH }}
        run: python scripts/email_alert.py ${{ inputs.test_email && '--test' || '' }}
      - name: Lock data again
        env:
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: python scripts/vault.py seal
      - name: Save results
        run: |
          git config user.name "job-hunt-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily job feed $(date -u +%F)"
          git push
