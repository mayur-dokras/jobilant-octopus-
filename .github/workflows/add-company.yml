name: Add approved company

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Track company') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet "cryptography>=42"
      - name: Unlock, add the company, lock again
        env:
          JOBHQ_PASSCODE: ${{ secrets.JOBHQ_PASSCODE }}
        run: |
          python scripts/vault.py open
          python scripts/add_company.py
          python scripts/vault.py seal
      - name: Save and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "job-hunt-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Track a new company"
          git push
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Done. The company is included from tomorrow's run."
